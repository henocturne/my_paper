<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
	<meta name="generator" content="Hugo 0.163.3"><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paper Library | Paper Library</title>
    <meta name="description" content="Academic Paper Management and Reading Platform">
    
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    
    <link rel="stylesheet" href="/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true},{left: '$', right: '$', display: false}]});">
    </script>
</head>
<body>
    <header class="site-header">
        <nav class="nav-container">
            <div class="nav-brand">
                <a href="/en/">
                    <span class="brand-icon">📚</span>
                    <span class="brand-text">Paper Library</span>
                </a>
            </div>
            <div class="nav-menu" id="navMenu">
                
                <a href="/en/" class="nav-link">
                    Home
                </a>
                
                <a href="/en/paper/" class="nav-link">
                    Papers
                </a>
                
                <a href="/en/tags/" class="nav-link">
                    Tags
                </a>
                
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle">
                    <i data-lucide="moon" class="icon-moon"></i>
                    <i data-lucide="sun" class="icon-sun"></i>
                </button>
                <button class="menu-toggle" id="menuToggle">
                    <i data-lucide="menu"></i>
                </button>
            </div>
        </nav>
    </header>

    <main class="main-content">
        
<div class="home-hero">
    <div class="hero-content">
        <h1 class="hero-title">Paper Library</h1>
        <p class="hero-subtitle">学术论文管理与阅读平台</p>
    </div>

    <div class="search-section">
        <div class="search-row">
            <select class="search-field-select" id="fieldSelector">
                <option value="all">全部</option>
                <option value="title">标题</option>
                <option value="authors">作者</option>
                <option value="venue">刊物</option>
                <option value="tags">标签</option>
            </select>
            <div class="search-input-wrap">
                <i data-lucide="search" class="si-icon" style="width:18px;height:18px;"></i>
                <input type="text" id="searchInput" placeholder="搜索论文..." autocomplete="off">
                <div class="autocomplete-box" id="autocompleteBox"></div>
            </div>
        </div>
    </div>

    <div class="home-stats"><a href="/paper/" class="stat-card">
            <span class="stat-number">0</span>
            <span class="stat-label">篇论文</span>
        </a>
        <a href="/tags/" class="stat-card">
            <span class="stat-number">0</span>
            <span class="stat-label">个标签</span>
        </a>
    </div>
</div>

<script>

var PAPERS = [];

(function() {
    var si = document.getElementById("searchInput");
    var ac = document.getElementById("autocompleteBox");
    var fs = document.getElementById("fieldSelector");
    var sf = "all";
    if (!si || !ac || !fs) return;

    fs.onchange = function() { sf = this.value; si.focus(); };

    si.oninput = function() {
        var q = this.value.toLowerCase().trim();
        if (!q) { ac.classList.remove("show"); return; }
        var r = [];
        PAPERS.forEach(function(p) {
            var m = function(v) { return v.toLowerCase().indexOf(q) >= 0; };
            var ok = false;
            if (sf === "all") ok = m(p.t) || m(p.v) || p.a.some(m) || p.g.some(m);
            else if (sf === "title") ok = m(p.t);
            else if (sf === "authors") ok = p.a.some(m);
            else if (sf === "venue") ok = m(p.v);
            else if (sf === "tags") ok = p.g.some(m);
            if (ok) r.push({t: p.t, u: p.u});
        });
        r = r.slice(0, 10);
        ac.innerHTML = r.map(function(x) { return "<div class=\"ac-item\" data-url=\"".concat(x.u, "\"><span class=\"ac-match\">").concat(x.t, "</span></div>"); }).join("");
        ac.classList.add("show");
        var f = ac.querySelector(".ac-item");
        if (f) f.classList.add("highlight");
    };

    si.onkeydown = function(e) {
        var items = ac.querySelectorAll(".ac-item");
        var active = ac.querySelector(".ac-item.highlight");
        var idx = active ? Array.from(items).indexOf(active) : -1;
        if (e.key === "ArrowDown") { e.preventDefault(); var n = Math.min(idx + 1, items.length - 1); items.forEach(function(i) { i.classList.remove("highlight"); }); if (items[n]) items[n].classList.add("highlight"); }
        else if (e.key === "ArrowUp") { e.preventDefault(); var p = Math.max(idx - 1, 0); items.forEach(function(i) { i.classList.remove("highlight"); }); if (items[p]) items[p].classList.add("highlight"); }
        else if (e.key === "Enter") { e.preventDefault(); if (active) window.location.href = active.dataset.url; else if (items.length) window.location.href = items[0].dataset.url; }
        else if (e.key === "Escape") { ac.classList.remove("show"); }
    };

    document.addEventListener("click", function(e) { if (!e.target.closest(".search-input-wrap")) ac.classList.remove("show"); });
    ac.onclick = function(e) { var item = e.target.closest(".ac-item"); if (item) window.location.href = item.dataset.url; };
})();
</script>

    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; 2026 Paper Library</p>
        </div>
    </footer>

    <script>
        lucide.createIcons();
        
        document.getElementById('themeToggle').addEventListener('click', function() {
            var html = document.documentElement;
            var next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            lucide.createIcons();
        });
        
        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('navMenu').classList.toggle('open');
        });
    </script>
</body>
</html>
